name: Generate academy
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academy-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Generate a batch
        id: generate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          MAX_TASKS: '40'
          RUN_MINUTES: '12'
        run: npm run generate
      - name: Preserve local checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-checkpoints-${{ github.run_id }}
          path: |
            course/
            production/drafts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit completed work
        if: always()
        run: |
          git config user.name "academy-bot"
          git config user.email "academy-bot@users.noreply.github.com"
          git add course production/drafts
          if ! git diff --cached --quiet; then
            git commit -m "Generate academy lessons"
            git push
          fi
      - name: Report generation failure
        if: steps.generate.outcome == 'failure'
        run: exit 1

