name: Generate academy drafts
on:
  schedule:
    # Six daily runs at four-hour intervals, below the per-model free-tier quotas.
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: academy-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: npm run build:queue
      - run: npm test
      - run: npm run validate:structure
      - id: pending
        name: Count eligible drafts
        run: npm run generate -- --dry-run
      - name: Generate bounded lesson drafts
        if: steps.pending.outputs.pending != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
          UNITS_PER_RUN: '80'
          MAX_API_CALLS_PER_RUN: '160'
        run: npm run generate
      - name: Compile and run DSA solution checks
        id: validate_dsa
        if: always() && steps.pending.outputs.pending != '0'
        run: npm run validate:dsa
      - name: Commit generated drafts
        if: always() && steps.pending.outputs.pending != '0' && steps.validate_dsa.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course/drafts curriculum/queue.json
          git diff --cached --quiet || git commit -m "Generate verified-shape lesson drafts"
          git push

