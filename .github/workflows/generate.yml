name: Generate academy drafts
on:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: academy-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run validate:structure
      - id: pending
        name: Count eligible drafts
        run: npm run generate -- --dry-run
      - name: Generate bounded lesson drafts
        if: steps.pending.outputs.pending != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          UNITS_PER_RUN: '100'
          MAX_API_CALLS_PER_RUN: '100'
        run: npm run generate
      - name: Commit generated drafts
        if: always() && steps.pending.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course/drafts
          git diff --cached --quiet || git commit -m "Generate verified-shape lesson drafts"
          git push

