name: Generate academy drafts
on:
  push:
    branches: [main]
    paths:
      - 'curriculum/manifests/**'
      - 'curriculum/prompt-template.json'
      - 'scripts/**'
      - 'course/drafts/**'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
  schedule:
    # Six daily runs at four-hour intervals, below the per-model free-tier quotas.
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: academy-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main before generation
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: npm run build:queue
      - run: npm test
      - run: npm run validate:structure
      - run: npm run validate:catalog
      - id: pending
        name: Count eligible drafts
        run: npm run generate -- --dry-run
      - name: Generate bounded lesson drafts
        if: steps.pending.outputs.pending != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.6-flash,gemini-3-flash-preview,gemini-4-hydrogen
          UNITS_PER_RUN: '80'
          MAX_API_CALLS_PER_RUN: '160'
        run: npm run generate
      - name: Generate a small batch after a curriculum update
        if: steps.pending.outputs.pending != '0' && github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.6-flash,gemini-3-flash-preview,gemini-4-hydrogen
          UNITS_PER_RUN: '1'
          MAX_API_CALLS_PER_RUN: '12'
        run: npm run generate
      - name: Compile and run DSA solution checks
        id: validate_dsa
        if: always() && steps.pending.outputs.pending != '0'
        run: npm run validate:dsa
      - name: Validate generated lesson drafts
        id: validate_drafts
        if: always() && steps.pending.outputs.pending != '0'
        run: npm run validate:drafts
      - name: Preserve generated drafts and quota ledger for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-drafts-${{ github.run_id }}
          path: |
            course/drafts/
            curriculum/model-usage.json
          if-no-files-found: ignore
      - name: Commit generated drafts
        if: always() && steps.pending.outputs.pending != '0'
        env:
          VALIDATION_PASSED: ${{ steps.validate_dsa.outcome != 'failure' && steps.validate_drafts.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$VALIDATION_PASSED" != "true" ]; then
            git stash push --include-untracked -- course/drafts curriculum/queue.json
          fi
          if [ -f curriculum/model-usage.json ]; then
            git add curriculum/model-usage.json
          fi
          if [ "$VALIDATION_PASSED" = "true" ]; then
            git add course/drafts curriculum/queue.json
          fi
          git diff --cached --quiet || git commit -m "Update generated academy drafts and Gemini quota usage"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "curriculum/model-usage.json" ]; then
              echo "Cannot safely reconcile generated commit conflicts: $conflicts" >&2
              exit 1
            fi
            git show :1:curriculum/model-usage.json > /tmp/model-usage-base.json
            git show :2:curriculum/model-usage.json > /tmp/model-usage-main.json
            git show :3:curriculum/model-usage.json > /tmp/model-usage-run.json
            node scripts/merge-model-usage.js /tmp/model-usage-base.json /tmp/model-usage-main.json /tmp/model-usage-run.json > /tmp/model-usage-merged.json
            cp /tmp/model-usage-merged.json curriculum/model-usage.json
            git add curriculum/model-usage.json
            GIT_EDITOR=true git rebase --continue
          done
          echo 'Could not push generated drafts after three synchronization attempts.' >&2
          exit 1

